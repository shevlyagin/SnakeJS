<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A classic Snake game built with HTML, CSS and JavaScript.">
  <title>SnakeJS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <h1>SnakeJS</h1>
        <p>A classic Snake game built with JavaScript.</p>
      </div>
      <button id="restart-button" type="button">Restart game</button>
    </header>

    <p id="game-status" class="game-status" aria-live="polite">
      Use the arrow keys or WASD to start.
    </p>

    <canvas
      id="game"
      width="608"
      height="608"
      aria-label="Snake game board"
    ></canvas>

    <p class="controls">Controls: arrow keys or WASD</p>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
